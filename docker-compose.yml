name: threatlens

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: threatlens
      POSTGRES_DB: threatlens
    ports:
      - "${THREATLENS_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens -d threatlens"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      THREATLENS_DATABASE_URL: postgresql+psycopg://threatlens:threatlens@db:5432/threatlens
      THREATLENS_LLM_API_KEY: ${THREATLENS_LLM_API_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "${THREATLENS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "${THREATLENS_WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
